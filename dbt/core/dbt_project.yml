# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'core'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'core'

# Required flag for elementary to work properly
flags:
  require_explicit_package_overrides_for_builtin_materializations: false

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Variables for Elementary data quality monitoring
vars:
  # Elementary configuration
  elementary:
    # Enable Elementary data collection
    enabled: true
    # Schema for Elementary metadata tables
    schema: "elementary"
    # Days to keep test results
    days_back: 7
    # Slack notifications (optional)
    slack_token: ""
    slack_channel: ""
    # Mute the materialization override warning
    mute_ensure_materialization_override: true

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  core:
    # Dimension tables
    dimensions:
      +materialized: table
      +schema: dimensions
    # Fact tables  
    facts:
      +materialized: table
      +schema: facts
    # Analytics views
    analytics:
      +materialized: view
      +schema: analytics
    # Config indicated by + and applies to all files under models/example/
    example:
      +materialized: table
  # Elementary models configuration
  elementary:
    +materialized: view
    +schema: elementary

# Seeds configuration
seeds:
  core:
    schema: prototype_data

# Test configurations
tests:
  +store_failures: true
  +schema: test_failures

# Snapshot configurations
snapshots:
  core:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: updated_at

